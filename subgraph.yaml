  - kind: ethereum
    name: SignalVaultETHUSD
    network: arbitrum-sepolia
    source:
      address: "0x0ee2b4ededdd55ac15c50c457cf3bad43242e9e4"
      abi: SignalVault
      startBlock: 217225430
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - EpochSettled
        - PredictionPosted
        - RewardCompounded
        - Staked
        - SyncFailed
        - Unstaked
      abis:
        - name: SignalVault
          file: ./abis/SignalVault.json
      eventHandlers:
        - event: EpochSettled(indexed uint256,uint256,uint256,uint256,uint256,uint256)
