dataSources:
  - kind: ethereum
    name: SignalVaultETHUSD
    network: arbitrum-sepolia
    source:
      address: "0x5f150ac7beeb28cba4585e381641fa67cfbb8e80"
      abi: SignalVault
      startBlock: 217225430
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - EpochSettled
        - PredictionPosted
        - RewardCompounded
        - Staked
        - SyncFailed
        - Unstaked
      abis:
        - name: SignalVault
          file: ./abis/SignalVault.json
      eventHandlers:
        - event: EpochSettled(indexed uint256,uint256,uint256,uint256,uint256,uint256)
