specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SignalVaultETHUSD
    network: arbitrum-one
    source:
      address: "0xb800b8dbcf9a78b16f5c1135cd1a39384abf1fbc"
      abi: SignalVault
      startBlock: 403446009
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - EpochSettled
        - PredictionPosted
        - RewardCompounded
        - Staked
        - SyncFailed
        - Unstaked
      abis:
        - name: SignalVault
          file: ./abis/SignalVault.json
      eventHandlers:
        - event: EpochSettled(indexed uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleEpochSettled
        - event: PredictionPosted(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handlePredictionPosted
        - event: RewardCompounded(indexed address,uint256)
          handler: handleRewardCompounded
        - event: Staked(indexed address,uint256)
          handler: handleStaked
        - event: SyncFailed(indexed address)
          handler: handleSyncFailed
        - event: Unstaked(indexed address,uint256)
          handler: handleUnstaked
      file: ./src/signal-vault.ts
  - kind: ethereum
    name: AssetVaultETHUSD
    network: arbitrum-one
    source:
      address: "0xc7a22081662faeedc27993cb72cba6141e15ba48"
      abi: AssetVault
      startBlock: 403446009
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - RedeemedPSM
        - Swap
      abis:
        - name: AssetVault
          file: ./abis/AssetVault.json
      eventHandlers:
        - event: RedeemedPSM(indexed address,indexed address,uint256,uint256)
          handler: handleRedeemedPSM
        - event: Swap(indexed address,uint256,uint256)
          handler: handleSwap
      file: ./src/asset-vault.ts
